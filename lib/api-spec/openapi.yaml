openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Team Hub — a workspace for distributed teams to manage projects, tasks, and people.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: members
    description: Team members
  - name: projects
    description: Projects
  - name: tasks
    description: Tasks within projects
  - name: comments
    description: Comments on tasks
  - name: dashboard
    description: Aggregated workspace insights
  - name: filter-presets
    description: Saved board filter presets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [members]
      summary: Get the currently signed-in member
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all team members
      responses:
        "200":
          description: A list of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
    post:
      operationId: createMember
      tags: [members]
      summary: Add a new team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberInput"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberInput"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Member deleted

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, archived]
          required: false
      responses:
        "200":
          description: A list of projects with summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Project deleted

  /projects/{id}/stats:
    get:
      operationId: getProjectStats
      tags: [projects, dashboard]
      summary: Get aggregated stats for a project
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks with optional filters
      parameters:
        - in: query
          name: projectId
          required: false
          schema:
            type: integer
        - in: query
          name: assigneeId
          required: false
          schema:
            type: integer
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [todo, in_progress, in_review, done]
      responses:
        "200":
          description: A list of tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task with detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (use to move between columns or edit details)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Task deleted

  /tasks/{id}/comments:
    get:
      operationId: listTaskComments
      tags: [comments]
      summary: List comments on a task
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
    post:
      operationId: createTaskComment
      tags: [comments]
      summary: Add a comment to a task
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /projects/{id}/filter-presets:
    get:
      operationId: listProjectFilterPresets
      tags: [filter-presets]
      summary: List saved board filter presets for the current member on a project
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Filter presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFilterPresetList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectFilterPreset
      tags: [filter-presets]
      summary: Save the current filter combination as a named preset
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardFilterPresetInput"
      responses:
        "201":
          description: Preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFilterPreset"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A preset with this name already exists for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/filter-presets/{presetId}:
    delete:
      operationId: deleteProjectFilterPreset
      tags: [filter-presets]
      summary: Delete a saved board filter preset
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: integer
        - in: path
          name: presetId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Preset deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level workspace summary for the home dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity across the workspace
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"

  /dashboard/my-tasks:
    get:
      operationId: getMyTasks
      tags: [dashboard]
      summary: Tasks assigned to the current member
      responses:
        "200":
          description: My tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"

  /dashboard/workload:
    get:
      operationId: getWorkload
      tags: [dashboard]
      summary: Workload breakdown per member
      responses:
        "200":
          description: Workload per member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadList"

components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Member:
      type: object
      required: [id, name, email, role, avatarColor, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          description: Role label, e.g. "Designer", "Engineer", "PM"
        avatarColor:
          type: string
          description: Hex color used for the member's avatar fallback
        createdAt:
          type: string
          format: date-time
    MemberList:
      type: array
      items:
        $ref: "#/components/schemas/Member"
    CreateMemberInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatarColor:
          type: ["string", "null"]
    UpdateMemberInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatarColor:
          type: string

    ProjectStatus:
      type: string
      enum: [active, archived]

    Project:
      type: object
      required:
        - id
        - name
        - description
        - color
        - status
        - taskCount
        - completedCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        color:
          type: string
          description: Hex color for project chip / accent
        status:
          $ref: "#/components/schemas/ProjectStatus"
        taskCount:
          type: integer
        completedCount:
          type: integer
        dueDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectList:
      type: array
      items:
        $ref: "#/components/schemas/Project"
    CreateProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date-time
    UpdateProjectInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date-time

    ProjectStats:
      type: object
      required:
        - projectId
        - totalTasks
        - todo
        - inProgress
        - inReview
        - done
        - completionPct
        - memberCount
        - overdueCount
      properties:
        projectId:
          type: integer
        totalTasks:
          type: integer
        todo:
          type: integer
        inProgress:
          type: integer
        inReview:
          type: integer
        done:
          type: integer
        completionPct:
          type: integer
          description: 0-100
        memberCount:
          type: integer
        overdueCount:
          type: integer

    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - description
        - status
        - priority
        - position
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
        position:
          type: number
          description: Sort order within the task's status column. Lower values render first.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskList:
      type: array
      items:
        $ref: "#/components/schemas/Task"
    CreateTaskInput:
      type: object
      required: [projectId, title]
      properties:
        projectId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
        position:
          type: number
          description: New sort position within the destination column.

    Comment:
      type: object
      required: [id, taskId, memberId, content, createdAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        memberId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    CommentList:
      type: array
      items:
        $ref: "#/components/schemas/Comment"
    CreateCommentInput:
      type: object
      required: [memberId, content]
      properties:
        memberId:
          type: integer
        content:
          type: string

    Activity:
      type: object
      required: [id, type, description, memberId, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          description: Event type e.g. task_created, task_moved, task_completed, project_created, comment_added
        description:
          type: string
        memberId:
          type: integer
        projectId:
          type: ["integer", "null"]
        taskId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
    ActivityList:
      type: array
      items:
        $ref: "#/components/schemas/Activity"

    DashboardSummary:
      type: object
      required:
        - activeProjects
        - totalTasks
        - openTasks
        - completedThisWeek
        - overdueTasks
        - myOpenTasks
        - byStatus
      properties:
        activeProjects:
          type: integer
        totalTasks:
          type: integer
        openTasks:
          type: integer
        completedThisWeek:
          type: integer
        overdueTasks:
          type: integer
        myOpenTasks:
          type: integer
        byStatus:
          type: object
          required: [todo, inProgress, inReview, done]
          properties:
            todo:
              type: integer
            inProgress:
              type: integer
            inReview:
              type: integer
            done:
              type: integer

    Workload:
      type: object
      required:
        - memberId
        - memberName
        - avatarColor
        - role
        - openTasks
        - todo
        - inProgress
        - inReview
        - done
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        avatarColor:
          type: string
        role:
          type: string
        openTasks:
          type: integer
        todo:
          type: integer
        inProgress:
          type: integer
        inReview:
          type: integer
        done:
          type: integer
    WorkloadList:
      type: array
      items:
        $ref: "#/components/schemas/Workload"

    BoardFilterPresetPayload:
      type: object
      required: [assigneeIds, priorities, overdueOnly]
      properties:
        assigneeIds:
          type: array
          items:
            type: integer
        priorities:
          type: array
          items:
            $ref: "#/components/schemas/TaskPriority"
        overdueOnly:
          type: boolean
    BoardFilterPreset:
      type: object
      required:
        - id
        - projectId
        - memberId
        - name
        - payload
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        projectId:
          type: integer
        memberId:
          type: integer
        name:
          type: string
        payload:
          $ref: "#/components/schemas/BoardFilterPresetPayload"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BoardFilterPresetList:
      type: array
      items:
        $ref: "#/components/schemas/BoardFilterPreset"
    CreateBoardFilterPresetInput:
      type: object
      required: [name, payload]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        payload:
          $ref: "#/components/schemas/BoardFilterPresetPayload"
